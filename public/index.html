<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var h = window.innerHeight;
        if (h > 0) document.documentElement.style.setProperty("--app-height", h + "px");
      })();
    </script>
    <script>
      (function () {
        var standalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true;
        if (!standalone || /(?:^|[?&])bust=/.test(location.search)) return;

        var root = document.documentElement;
        root.style.background = "#100c0a";
        root.style.visibility = "hidden";

        var sep = location.search ? "&" : "?";
        var next = location.pathname + location.search + sep + "bust=" + Date.now() + location.hash;
        var ctrl = typeof AbortController === "function" ? new AbortController() : null;
        var timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
        }, 2500);

        fetch(next, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
          .then(function (res) {
            clearTimeout(timer);
            if (res.ok) location.replace(next);
            else root.style.visibility = "";
          })
          .catch(function () {
            clearTimeout(timer);
            root.style.visibility = "";
          });
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1410" />
    <meta
      name="description"
      content="The Shlyapa — командная игра на объяснение и угадывание слов на время."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-title" content="The Shlyapa" />
    <title>The Shlyapa</title>
  </head>
  <body>
    <noscript>Чтобы играть, включите JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
